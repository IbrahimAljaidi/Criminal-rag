<body class="auth-page" data-auth-mode="register">
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="scales" viewBox="0 0 32 32"><path d="M16 5v22M7 10h18M7 11l-4 9c2 3 6 3 8 0l-4-9Zm18 0-4 9c2 3 6 3 8 0l-4-9ZM10 27h12"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></symbol></defs></svg>
<header class="header"><div class="header-inner"><a class="brand" href="./" aria-label="المساعد القانوني، الصفحة الرئيسية"><span class="brand-icon"><svg><use href="#scales"/></svg></span><span><strong>المساعد القانوني</strong><small>نظام الإجراءات الجزائية السعودي</small></span></a><div class="header-end"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="الوضع الداكن" aria-pressed="false"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>داكن</span></button><button id="language-toggle" class="language-toggle" type="button" lang="en" aria-label="Switch to English">English</button></div></div></header>
<main class="auth-main">
<a class="back-link" href="index.html"><svg aria-hidden="true"><use href="#arrow"/></svg><span data-copy="back">العودة لتسجيل الدخول</span></a>
<section class="auth-card" aria-labelledby="auth-title">
<div class="auth-heading"><div class="welcome-mark"><svg aria-hidden="true"><use href="#scales"/></svg></div><h1 id="auth-title" data-copy="title">إنشاء حساب</h1><p data-copy="subtitle">أدخل بياناتك لإنشاء حساب في المساعد القانوني.</p></div>
<form id="auth-form" novalidate>
<div class="auth-field"><label for="name" data-copy="name">الاسم الكامل</label><input id="name" name="name" type="text" autocomplete="name" maxlength="100" required dir="auto"><span class="field-error" id="name-error"></span></div><div class="auth-field"><label for="identifier" data-copy="identifier">البريد الإلكتروني أو رقم الجوال</label><input id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required dir="ltr" placeholder="name@example.com / 05xxxxxxxx" aria-describedby="identifier-error"><span class="field-error" id="identifier-error"></span></div><div class="auth-field"><label for="password" data-copy="password">كلمة المرور</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-hint password-error"><button type="button" class="password-toggle" data-password="password" aria-controls="password" aria-pressed="false">إظهار</button></div><small id="password-hint" data-copy="passwordHint">استخدم 8 أحرف على الأقل.</small><span class="field-error" id="password-error"></span></div><div class="auth-field"><label for="confirm-password" data-copy="confirm">تأكيد كلمة المرور</label><div class="password-field"><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="confirm-password-error"><button type="button" class="password-toggle" data-password="confirm-password" aria-controls="confirm-password" aria-pressed="false">إظهار</button></div><span class="field-error" id="confirm-password-error"></span></div>
<p id="auth-feedback" class="auth-feedback" role="status" hidden></p>
<button type="submit" class="auth-submit" data-copy="submit">إنشاء حساب</button>
</form>
<p class="auth-switch"><span data-copy="switchPrompt">لديك حساب بالفعل؟</span> <a href="index.html" data-copy="switchLink">تسجيل الدخول</a></p>
</section>
</main>
<footer class="footer"><span data-copy="brand">المساعد القانوني</span><span data-copy="law">نظام الإجراءات الجزائية السعودي ولائحته التنفيذية</span></footer>
</body></html>
